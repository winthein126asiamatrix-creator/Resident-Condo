name: test
description: A reusable Flutter architecture template.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  dio: ^5.7.0
  flutter_secure_storage: ^11.2.0
  get: ^4.7.3
  image_picker: ^1.2.3
  shared_preferences: ^2.3.2
  connectivity_plus: ^7.3.2
  flutter_screenutil: ^5.9.3
  drift: ^2.35.2
  path_provider: ^2.1.6
  path: ^1.9.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  firebase_in_app_messaging: ^0.10.0
  firebase_app_installations: ^0.5.0

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/images/app_logo.png
    - assets/images/app_icon.png
    - assets/images/condo-phone-app-icon-hexagon.png
    - assets/images/amenities/
    - shorebird.yaml
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.otf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.otf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.otf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.otf
          weight: 700
    - family: Pyidaungsu
      fonts:
        - asset: assets/fonts/Pyidaungsu-2.5.3_Regular.ttf
          weight: 400
        - asset: assets/fonts/Pyidaungsu-2.5.3_Bold.ttf
          weight: 700
