name: test
description: A reusable Flutter architecture template.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  get: ^4.7.3
  image_picker: ^1.2.3
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.1.0
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/images/app_logo.png
    - assets/images/app_icon.png
    - assets/images/amenities/
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.otf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.otf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.otf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.otf
          weight: 700
    - family: Pyidaungsu
      fonts:
        - asset: assets/fonts/Pyidaungsu-2.5.3_Regular.ttf
          weight: 400
        - asset: assets/fonts/Pyidaungsu-2.5.3_Bold.ttf
          weight: 700
