org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation cannot relativize source paths that live on a
# different drive than the project. Plugin sources are in the pub cache on C:
# while this project is on D:, which makes the incremental compiler crash with
# "this and base files have different roots". Full (non-incremental) Kotlin
# compilation avoids that. Remove this if the project and pub cache share a drive.
kotlin.incremental=false
